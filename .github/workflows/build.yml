name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖（postinstall 会自动准备 Electron 运行时）
        run: npm ci
      - name: 确认 Electron 运行时
        run: npm run electron:ensure
      # 打包前先核对版本号：tag 必须和 package.json 里的 version 完全一致。
      # v0.2.1 那次踩过：tag 打在了版本号还是 0.2.0 的提交上，CI 照样打包发布，
      # 结果 Release 写的是 v0.2.1、exe 里的 app.getVersion() 却是 0.2.0，
      # 用户「更新成功」后版本号纹丝不动，更新器每次还以为有新版本。
      - name: 校验版本号与 tag 一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $pkg = (Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          $tagVer = $tag.TrimStart('v')
          if ($tagVer -ne $pkg) {
            throw "tag '$tag' 与 package.json 的 version '$pkg' 不一致：请先把 version 改成 $tagVer 并提交，再重新打 tag"
          }
          Write-Host "版本号校验通过：$tag = package.json $pkg"
      - name: 打包免安装 exe
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # 打完再验一次：确认 exe 里 app.asar 的 package.json 版本就是这次要发布的版本。
      # 上一步只保证「打包输入」对，这一步保证「打包产物」对（防止用了残留的旧产物）。
      - name: 校验产物版本
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $want = (Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          $asar = 'dist/win-unpacked/resources/app.asar'
          if (-not (Test-Path $asar)) { throw "没找到 $asar" }
          $got = node -e "const a=require('@electron/asar');process.stdout.write(JSON.parse(a.extractFile('$asar','package.json').toString()).version)"
          if ($got -ne $want) { throw "打包产物版本是 $got，应为 $want（多半是用了残留的旧产物）" }
          Write-Host "产物版本校验通过：$got"
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: NovelFolio-Windows
          path: dist/*.exe
          if-no-files-found: error
      - name: 发布 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          # 资产名故意不带版本号：releases/latest/download/NovelFolio-portable.exe 永远指向最新一次发布，
          # 打包在应用里的更新器就是靠这个固定名字找新版的（见 app/lib/updater.js 的 ASSET_NAME）。
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          if (-not $exe) { throw '没找到打包产物，dist 目录里没有 exe' }
          $mb = [math]::Round($exe.Length/1MB,1)
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()

          # 说明文字用数组拼：不用 here-string。
          # here-string 里给变量加反引号在 pwsh 7 上会被当成转义符，
          # v0.2.2 那次 Release 就是因为这一步整段脚本解析失败、exe 打包好却发不出去。
          $notesLines = @(
            '卷帙 NovelFolio ' + $tag + ' —— 离线优先的中文长篇小说创作工作台。'
            ''
            '**下载**：' + $exe.Name + '（' + $mb + ' MB，免安装，双击即用，Windows 10/11 x64）'
            ''
            '首次启动会在 %APPDATA%\novelfolio 生成一份演示作品（《临水问剑》），'
            '想换成自己的可以「设置 → 导入 JSON」。作品数据与系统加密的 API Key 都只存在这个目录。'
            ''
            '拆书（书籍分析）需要自己在「设置 → 模型接口」里填 OpenAI 兼容接口的地址、'
            '模型名和 Key；其余模块完全离线可用，软件没有账号、没有埋点、没有崩溃上报。'
            ''
            '**校验**：SHA256 ' + $hash + '（下载后可用 Get-FileHash 文件名 -Algorithm SHA256 核对）'
            ''
            '完整改动见 [提交记录](https://github.com/Andrianxu/novel-create/commits/' + $tag + ')。'
          )
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Path $notesFile -Value $notesLines -Encoding utf8

          # --notes-file 比 --notes 稳：不经过命令行参数的转义
          gh release create $tag $exe.FullName --title ("卷帙 NovelFolio " + $tag) --notes-file $notesFile --verify-tag --latest