name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖（postinstall 会自动准备 Electron 运行时）
        run: npm ci
      - name: 确认 Electron 运行时
        run: npm run electron:ensure
      - name: 打包免安装 exe
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: NovelFolio-Windows
          path: dist/*.exe
          if-no-files-found: error
