<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'">
<title>卷帙 NovelFolio</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- 启动动画：盖住冷启动的等待。结构全部内联，脚本一跑就能画，不等任何网络 / IPC。
     图标里的两条黑色折线是拆开写的（.bt-line），这样它们才能各自飞向左下 / 右上；
     飞走之后图标本体淡出，红色箭头脱出来单独转 + 左移。 -->
<div id="boot" class="boot">
  <div class="bt-stage">
    <!-- 图标本体：只剩下「卷」字回形纹的圆角底 + 两条折线的原位。
         两条折线是独立元素，飞行时不跟着这个容器走。 -->
    <div class="bt-stack" id="btStack">
      <!-- 图标里那块浅色圆角底 -->
      <div class="bt-tile" id="btTile"></div>

      <!-- 右上角那条折线：M66,62 → 140,62 → 弧 → 162,84 → 162,118 -->
      <svg class="bt-line bt-line-tr" id="btLineTR" viewBox="0 0 240 240" aria-hidden="true">
        <path d="M66 62 h74 q22 0 22 22 v34" fill="none" stroke="#201C18" stroke-width="17" stroke-linecap="round"/>
      </svg>

      <!-- 左下角那条折线：M174,178 → 100,178 → 弧 → 78,156 → 78,122 -->
      <svg class="bt-line bt-line-bl" id="btLineBL" viewBox="0 0 240 240" aria-hidden="true">
        <path d="M174 178 h-74 q-22 0 -22 -22 v-34" fill="none" stroke="#201C18" stroke-width="17" stroke-linecap="round"/>
      </svg>

      <!-- 红色箭头：从图标中心脱出，做顺时针 90° + 左移 -->
      <svg class="bt-arrow" id="btArrow" viewBox="0 0 240 240" aria-hidden="true">
        <path d="M120 88 l24 44 l-24 -13 l-24 13 Z" fill="#A8322A"/>
      </svg>
    </div>

    <!-- 打字字幕：每个字一个 span，逐个点亮（不做宽度变化，避免文字跟着抖） -->
    <div class="bt-type" id="btType" aria-label="欢迎来到您创造的世界"><i class="bt-caret" id="btCaret"></i></div>
  </div>
</div>
<div id="app" hidden>
  <header class="topbar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 240 240" aria-hidden="true">
        <rect width="240" height="240" rx="56" fill="#F6F1E6"/>
        <rect x="2" y="2" width="236" height="236" rx="54" fill="none" stroke="#DFD4BF" stroke-width="2"/>
        <path d="M66 62 h74 q22 0 22 22 v34" fill="none" stroke="#201C18" stroke-width="17" stroke-linecap="round"/>
        <path d="M174 178 h-74 q-22 0 -22 -22 v-34" fill="none" stroke="#201C18" stroke-width="17" stroke-linecap="round"/>
        <path d="M120 88 l24 44 l-24 -13 l-24 13 Z" fill="#A8322A"/>
      </svg>
      <!-- 当前书籍：点一下打开书库，可新建 / 切换 / 改名 / 复制 / 删除 -->
      <div class="bookchip" id="bookChip" title="当前书籍 · 点这里新建或切换" data-probe="book-chip">
        <div class="brandtxt">
          <div class="bn"><span id="bookTitle">卷帙</span><span class="bk-caret">▾</span></div>
          <div class="bs" id="bookScope">NOVELFOLIO</div>
        </div>
      </div>
    </div>
    <nav class="modes" id="nav"></nav>
    <div class="grow"></div>
    <div class="search" id="quickSearch">⌕ 搜索人物 / 情节 / 设定 <span class="kbd">Ctrl K</span></div>
    <div class="sync-dot" id="syncDot" title="同步：未开启" hidden></div>
    <div class="uchip" id="authorChip" title="点这里改作者名"><span class="av" id="authorAv">墨</span><span id="authorName">墨明</span></div>
  </header>
  <main id="view"></main>
  <footer class="statusbar">
    <span id="statLeft">就绪</span>
    <span class="grow"></span>
    <span id="statRight"></span>
  </footer>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
